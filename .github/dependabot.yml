# Weekly version updates for the SHA-pinned actions, grouped into one PR.
# Actions only, deliberately: Manifest.toml and the scripts' inline pins
# change published bytes, so they move by hand with a rebuild (CLAUDE.md).
# Cooldown: a release waits 7 days before a version update proposes it, time
# for a compromised release to be caught and yanked. Security updates skip it.
# The merge-dependabot job in .github/workflows/verify.yml squash-merges each PR once its checks pass.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      all-actions:
        patterns:
          - "*"
